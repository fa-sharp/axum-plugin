[package]
name = "axum-app-wrapper"
version = "0.1.2"
edition = "2024"

[workspace]
resolver = "2"
members = [".", "crates/*"]

[dependencies]
anyhow = "1.0"
axum = "0.8"
axum-app-wrapper-macros = { path = "crates/axum-app-wrapper-macros" }
futures = "0.3"
type-map = "0.5"

[dev-dependencies]
tokio = {
  version = "1.52.3",
  default-features = false,
  features = ["net", "rt", "rt-multi-thread", "signal"]
}
tracing = "0.1.44"
