[package]
name = "axum-plugin"
version = "0.3.0"
edition = "2024"
rust-version = "1.94"
description = "A small plugin layer for axum applications"
repository = "https://github.com/fa-sharp/axum-plugin"
license = "MIT"
keywords = ["axum", "config", "plugin", "setup"]
categories = ["config", "web-programming"]

[features]
default = ["macros"]
config = ["dep:figment", "dep:serde", "serde/derive"]
macros = ["dep:axum-plugin-macros"]

[dependencies]
anyhow = "1.0"
axum = "0.8"
axum-plugin-macros = { path = "crates/macros", version = "0.1.0", optional = true }
figment = { version = "0.10", features = ["env", "toml"], optional = true }
futures = "0.3"
serde = { version = "1", optional = true }
tower = "0.5"
type-map = "0.5"

[dev-dependencies]
tracing = "0.1.44"

[dev-dependencies.tokio]
version = "1.52.3"
default-features = false
features = ["net", "rt", "rt-multi-thread", "signal"]

[workspace]
resolver = "2"
members = [".", "crates/*"]
